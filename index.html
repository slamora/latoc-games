<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wild West Games</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111;
      color: #e0d6c8;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d4a843;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: #7a6e60;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      margin-bottom: 3rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 860px;
    }

    .card {
      background-color: #1c1c1c;
      border: 1px solid #2e2a24;
      border-radius: 12px;
      padding: 2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #d4a843;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card-thumb {
      font-size: 4rem;
      line-height: 1;
      user-select: none;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      text-align: center;
      color: #e0d6c8;
      letter-spacing: 0.04em;
    }

    .card-cta {
      margin-top: auto;
      font-size: 0.8rem;
      color: #d4a843;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <h1>Wild West Games</h1>
  <p class="subtitle">Elige tu juego</p>

  <div class="grid">

    <a class="card" href="circular-simon.html">
      <div class="card-thumb">🎯</div>
      <div class="card-title">Circular Simon<br>Tactical Edition</div>
      <span class="card-cta">Jugar →</span>
    </a>

    <a class="card" href="ciudad-sin-ley.html">
      <div class="card-thumb">🤠</div>
      <div class="card-title">Ciudad sin Ley</div>
      <span class="card-cta">Jugar →</span>
    </a>

    <a class="card" href="vaca-saltarina.html">
      <div class="card-thumb">🐄</div>
      <div class="card-title">Juego de la Vaca Saltarina<br>Ternera del Pirineo</div>
      <span class="card-cta">Jugar →</span>
    </a>

  </div>

</body>
</html>
